name: Docker

on:
  push:
    # 14.10, Sid ("rien n'a jamais été fait pour sofa nulle part ailleurs
    # que sur mes NAS" / "il faut surtout pas que ça parte sur
    # jakejarvis"): the image was always built locally on FUNMEDIA until
    # now - this workflow (forked from upstream, never actually used)
    # still targeted upstream's own main branch and registry namespace.
    # postgres-migration is this fork's real deploy branch; main is left
    # alone in case it's ever used to track upstream again.
    branches: [postgres-migration]
    paths:
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "Dockerfile"
      - "turbo.json"
      - "package.json"
      - "bun.lock"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "tsconfig.json"
      - ".github/workflows/docker.yml"
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # 14.10, Sid: never jakejarvis's own namespace - this is her private
  # fork/rebrand, not something to publish under the upstream author's
  # account (and she has no write access there regardless).
  GHCR_IMAGE: ghcr.io/sidounette79/patoune-tv

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get app version
        id: version
        run: echo "version=$(jq -r .version apps/web/package.json)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=edge,branch=postgres-migration
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 14.10, Sid: FUNMEDIA is the only real target (x86 NAS) - arm64
          # was only ever useful for jakejarvis's own broader userbase.
          # Dropping it (and the QEMU emulation step it needed) cuts real
          # build time on GitHub's shared runners.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
